<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
    
    .bg-rect { fill: url(#bg); }
    
    .cyber-line {
      stroke: #00F0FF;
      stroke-width: 2;
      fill: none;
      filter: url(#glow);
    }

    .cyber-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 24px;
      fill: #00FFA3;
      filter: url(#glow);
      text-anchor: middle;
      opacity: 0;
      animation: type 0.5s 1s forwards;
    }
    
    .sub-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      fill: #94A3B8;
      text-anchor: middle;
      opacity: 0;
      animation: type 0.5s 1.5s forwards;
    }

    @keyframes type {
      to { opacity: 1; }
    }
    
    .warning-bar {
      fill: #00F0FF;
      animation: slide 5s linear infinite;
    }
    
    @keyframes slide {
      0% { transform: translateX(-800px); }
      100% { transform: translateX(800px); }
    }
  </style>

  <rect width="800" height="150" class="bg-rect" />
  
  <path d="M 20 20 L 100 20 L 120 40 L 680 40 L 700 20 L 780 20 L 780 130 L 700 130 L 680 110 L 120 110 L 100 130 L 20 130 Z" class="cyber-line" />
  
  <clipPath id="clip-bar">
    <rect x="125" y="115" width="550" height="5" />
  </clipPath>
  <g clip-path="url(#clip-bar)">
    <rect x="0" y="115" width="200" height="5" class="warning-bar" />
    <rect x="400" y="115" width="200" height="5" class="warning-bar" />
  </g>

  <text x="400" y="75" class="cyber-text">>_ SYSTEM_IDLE_MODE_ACTIVATED</text>
  <text x="400" y="95" class="sub-text">NEXUS_OS // END OF TRANSMISSION</text>
</svg>
