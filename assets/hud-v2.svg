<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%">
  <defs>
    <filter id="neon-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;display=swap');
    
    .hud-base { fill: none; stroke: #F2CC8F; stroke-width: 2; opacity: 0.3; }
    
    .ring-1 {
      fill: none; stroke: #81B29A; stroke-width: 4;
      stroke-dasharray: 40 20;
      transform-origin: 200px 200px;
      animation: spin 12s linear infinite;
      filter: url(#neon-green);
    }
    
    .ring-2 {
      fill: none; stroke: #E07A5F; stroke-width: 2;
      stroke-dasharray: 100 50 20 50;
      transform-origin: 200px 200px;
      animation: spin-reverse 8s linear infinite;
      filter: url(#neon-cyan);
    }
    
    .ring-3 {
      fill: none; stroke: #F2CC8F; stroke-width: 6;
      stroke-dasharray: 2 15;
      transform-origin: 200px 200px;
      animation: spin 20s linear infinite;
    }

    .radar-sweep {
      fill: #F2CC8F; opacity: 0.15;
      transform-origin: 200px 200px;
      animation: spin 4s linear infinite;
    }

    .hud-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      fill: #F4F1DE;
      text-anchor: middle;
      filter: url(#neon-cyan);
      animation: pulse 2s infinite;
    }
    
    .hud-sub {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      fill: #81B29A;
      text-anchor: middle;
      letter-spacing: 2px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
  </style>

  <!-- Crosshairs -->
  <line x1="200" y1="50" x2="200" y2="350" class="hud-base" stroke-dasharray="5 5"/>
  <line x1="50" y1="200" x2="350" y2="200" class="hud-base" stroke-dasharray="5 5"/>

  <!-- Rotating Rings -->
  <circle cx="200" cy="200" r="140" class="ring-1" />
  <circle cx="200" cy="200" r="110" class="ring-2" />
  <circle cx="200" cy="200" r="80" class="ring-3" />

  <!-- Radar Sweep -->
  <path d="M200,200 L200,60 A140,140 0 0,1 340,200 Z" class="radar-sweep" />

  <!-- Inner Data -->
  <circle cx="200" cy="200" r="45" fill="#151210" />
  <circle cx="200" cy="200" r="45" stroke="#E07A5F" stroke-width="2" fill="none" filter="url(#neon-cyan)"/>
  
  <text x="200" y="205" class="hud-text">100%</text>
  <text x="200" y="225" class="hud-sub">SECURE</text>

  <!-- Outer HUD Accents -->
  <path d="M 50 200 L 40 190 L 40 150 M 50 200 L 40 210 L 40 250" stroke="#81B29A" stroke-width="2" fill="none" filter="url(#neon-green)"/>
  <path d="M 350 200 L 360 190 L 360 150 M 350 200 L 360 210 L 360 250" stroke="#81B29A" stroke-width="2" fill="none" filter="url(#neon-green)"/>
</svg>
