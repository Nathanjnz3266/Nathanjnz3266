<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%">
  <defs>
    <filter id="glow-neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <style>
    .line {
      stroke: url(#line-grad);
      stroke-width: 2;
      opacity: 0.6;
    }
    
    .pulse-dot {
      fill: #00FFA3;
      filter: url(#glow-neon);
      animation: travel 3s linear infinite;
    }

    @keyframes travel {
      0% { transform: translateX(0); }
      100% { transform: translateX(800px); }
    }
  </style>

  <line x1="0" y1="10" x2="800" y2="10" class="line" />
  <circle cx="0" cy="10" r="3" class="pulse-dot" />
</svg>
