<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-mint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.5" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap');
    
    .bg { fill: url(#bg-grad); }
    .grid { fill: url(#grid); }
    
    .card-panel {
      fill: url(#card-bg);
      stroke: #334155;
      stroke-width: 1;
    }

    .accent-cyan { fill: #00F0FF; filter: url(#glow-cyan); }
    .accent-mint { fill: #00FFA3; filter: url(#glow-mint); }
    
    .title-main { font-family: 'Chakra Petch', sans-serif; font-size: 32px; font-weight: 700; fill: #FFFFFF; letter-spacing: 4px; }
    .title-sub { font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 500; fill: #94A3B8; letter-spacing: 2px; }
    
    .label { font-family: 'Share Tech Mono', monospace; font-size: 10px; fill: #64748B; letter-spacing: 1px; text-transform: uppercase; }
    .value-cyan { font-family: 'Share Tech Mono', monospace; font-size: 14px; fill: #00F0FF; }
    .value-mint { font-family: 'Share Tech Mono', monospace; font-size: 14px; fill: #00FFA3; }
    .value-white { font-family: 'Share Tech Mono', monospace; font-size: 14px; fill: #F8FAFC; }
    
    .nexus-header { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #00F0FF; letter-spacing: 3px; }

    .scan-line {
      fill: #00F0FF;
      opacity: 0.5;
      animation: scan 3s linear infinite;
    }

    @keyframes scan {
      0% { transform: translateY(0); }
      50% { transform: translateY(120px); }
      100% { transform: translateY(0); }
    }

    .pulse { animation: pulse-anim 2s infinite; }
    @keyframes pulse-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    ]]>
  </style>

  <!-- Background Base -->
  <rect class="bg" width="800" height="350" />
  <rect class="grid" width="800" height="350" />
  
  <!-- Top Decor -->
  <path d="M 20 20 L 50 20 L 60 30 L 740 30 L 750 20 L 780 20" fill="none" stroke="#334155" stroke-width="1" />
  <circle cx="20" cy="20" r="3" class="accent-cyan" />
  <text x="70" y="25" class="nexus-header">NEXUS // DIGITAL IDENTITY</text>
  <text x="780" y="25" class="label" text-anchor="end">MODULE 01/06 | PROC: ID.VERIFY</text>

  <!-- Main Card Panel -->
  <rect x="40" y="60" width="720" height="250" class="card-panel" rx="4" />
  
  <!-- Left Side: Face Scan HUD -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="120" height="140" fill="none" stroke="#334155" stroke-width="2" />
    <!-- HUD Corners -->
    <path d="M 0 10 L 0 0 L 10 0" fill="none" stroke="#00F0FF" stroke-width="2" />
    <path d="M 110 0 L 120 0 L 120 10" fill="none" stroke="#00F0FF" stroke-width="2" />
    <path d="M 0 130 L 0 140 L 10 140" fill="none" stroke="#00F0FF" stroke-width="2" />
    <path d="M 110 140 L 120 140 L 120 130" fill="none" stroke="#00F0FF" stroke-width="2" />
    
    <!-- Abstract Wireframe Face -->
    <path d="M 30 50 C 30 30, 90 30, 90 50 C 100 80, 80 120, 60 120 C 40 120, 20 80, 30 50 Z" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.3" />
    <line x1="20" y1="65" x2="100" y2="65" stroke="#00F0FF" stroke-width="1" opacity="0.5" />
    <circle cx="45" cy="65" r="3" class="accent-cyan" />
    <circle cx="75" cy="65" r="3" class="accent-cyan" />
    
    <!-- Scanning Line inside HUD -->
    <g clip-path="url(#clip-scan)">
      <rect x="0" y="10" width="120" height="2" class="scan-line" />
    </g>
    <clipPath id="clip-scan"><rect x="0" y="0" width="120" height="140" /></clipPath>
    
    <!-- Status under face -->
    <rect x="0" y="150" width="120" height="15" fill="#00FFA3" opacity="0.2" />
    <text x="60" y="161" class="label" fill="#00FFA3" text-anchor="middle">BIO.MATCH: 99.9%</text>
  </g>

  <!-- Right Side: Text Data -->
  <g transform="translate(210, 85)">
    <!-- Header Ribbon -->
    <rect x="0" y="0" width="130" height="20" fill="#00FFA3" opacity="0.15" />
    <text x="10" y="14" class="label" fill="#00FFA3">&#x2713; OPEN TO INTERNSHIP</text>
    
    <!-- Name -->
    <text x="0" y="55" class="title-main">NAPATTAPONQ</text>
    <text x="0" y="85" class="title-sub">YUWANNASIRI</text>
    
    <!-- Sub Data -->
    <text x="0" y="115" class="label">ALIAS</text>
    <text x="45" y="116" class="value-cyan">KONG / NATHAN</text>

    <text x="0" y="140" class="value-white">Front-End Developer</text>
    <text x="0" y="160" class="value-white">Cybersecurity Enthusiast (OSINT)</text>
  </g>

  <!-- Bottom Data Row -->
  <g transform="translate(60, 275)">
    <text x="0" y="0" class="label">ID NUMBER</text>
    <text x="0" y="15" class="value-white">NX-04291-NY</text>
    
    <text x="150" y="0" class="label">STATUS</text>
    <text x="150" y="15" class="value-mint pulse">SEEKING INTERNSHIP</text>
    
    <text x="350" y="0" class="label">AGE</text>
    <text x="350" y="15" class="value-white">21</text>
    
    <text x="450" y="0" class="label">LOCATION</text>
    <text x="450" y="15" class="value-cyan">PHITSANULOK, TH</text>

    <!-- Barcode Decor -->
    <rect x="610" y="0" width="2" height="20" fill="#94A3B8" />
    <rect x="614" y="0" width="4" height="20" fill="#94A3B8" />
    <rect x="620" y="0" width="1" height="20" fill="#94A3B8" />
    <rect x="624" y="0" width="3" height="20" fill="#94A3B8" />
    <rect x="630" y="0" width="5" height="20" fill="#94A3B8" />
    <rect x="638" y="0" width="2" height="20" fill="#94A3B8" />
    <rect x="643" y="0" width="1" height="20" fill="#94A3B8" />
    <rect x="646" y="0" width="4" height="20" fill="#94A3B8" />
    <rect x="653" y="0" width="2" height="20" fill="#94A3B8" />
    <rect x="657" y="0" width="3" height="20" fill="#94A3B8" />
    <rect x="663" y="0" width="1" height="20" fill="#94A3B8" />
    <rect x="667" y="0" width="3" height="20" fill="#94A3B8" />
  </g>

  <!-- Digital Signature Wave -->
  <path d="M 60 325 Q 70 315, 80 325 T 100 325 T 120 325 T 140 325" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.7" />
  <text x="160" y="328" class="label" opacity="0.5">NX&lt;&lt;YUWANNASIRI&lt;&lt;NAPATTAPONQ&lt;&lt;&lt;&lt;&lt;</text>

</svg>
