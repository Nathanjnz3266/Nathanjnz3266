<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-mint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap');
    
    .bg { fill: url(#bg-grad); }
    
    .panel { fill: #020617; stroke: #334155; stroke-width: 1; opacity: 0.8; }
    
    .title-main { font-family: 'Chakra Petch', sans-serif; font-size: 20px; font-weight: 700; fill: #F8FAFC; letter-spacing: 2px; }
    .title-sub { font-family: 'Share Tech Mono', monospace; font-size: 10px; fill: #64748B; letter-spacing: 2px; text-transform: uppercase; }
    
    .label { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #94A3B8; }
    .label-glow { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #00F0FF; filter: url(#glow-cyan); }
    .score { font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 700; fill: #00FFA3; }
    
    .radar-grid { fill: none; stroke: #334155; stroke-width: 1; }
    .radar-fill { fill: #00F0FF; fill-opacity: 0.15; stroke: #00F0FF; stroke-width: 2; filter: url(#glow-cyan); }
    .radar-point { fill: #00F0FF; }

    .bar-bg { fill: #1E293B; }
    .bar-fill { fill: #00F0FF; filter: url(#glow-cyan); }
    .bar-fill-alt { fill: #00FFA3; filter: url(#glow-mint); }
    
    .nav-tab { fill: none; stroke: #00F0FF; stroke-width: 1; opacity: 0.5; }
    .nav-tab.active { fill: #00F0FF; fill-opacity: 0.1; stroke: #00F0FF; opacity: 1; }
    .nav-text { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #F8FAFC; }
    
    .pulse { animation: pulse-anim 2s infinite; }
    @keyframes pulse-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    ]]>
  </style>

  <!-- Background Base -->
  <rect class="bg" width="800" height="420" />
  
  <!-- Header Section -->
  <g transform="translate(30, 30)">
    <circle cx="5" cy="-5" r="4" fill="none" stroke="#00F0FF" stroke-width="2" class="pulse" />
    <text x="20" y="0" class="title-sub">EVALUATION PERSPECTIVE:</text>
    
    <rect x="250" y="-12" width="130" height="20" class="nav-tab active" />
    <text x="315" y="2" class="nav-text" text-anchor="middle">360° All-Round</text>
    
    <rect x="385" y="-12" width="130" height="20" class="nav-tab" />
    <text x="450" y="2" class="nav-text" text-anchor="middle" opacity="0.5">Front-End &amp; UI</text>
    
    <rect x="520" y="-12" width="130" height="20" class="nav-tab" />
    <text x="585" y="2" class="nav-text" text-anchor="middle" opacity="0.5">Cyber Security</text>
  </g>

  <!-- Left Panel: Evaluation Overview & Radar Chart -->
  <g transform="translate(30, 70)">
    <text x="0" y="10" class="title-sub">EVALUATED ROLE // TRK.ALL</text>
    <text x="0" y="30" class="title-main">ALL-ROUND CS OPERATOR</text>
    <text x="0" y="45" class="title-sub" fill="#00F0FF">FULL PROFILE · 6 VECTORS</text>

    <!-- Score Box -->
    <rect x="0" y="60" width="80" height="40" fill="#0F172A" stroke="#334155" />
    <text x="10" y="75" class="title-sub">LVL</text>
    <text x="40" y="90" class="title-main" fill="#00F0FF">65</text>
    
    <rect x="90" y="60" width="80" height="40" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" />
    <text x="100" y="75" class="title-sub" fill="#00F0FF">POTENTIAL</text>
    <text x="130" y="90" class="title-main" fill="#00F0FF">88</text>

    <!-- Radar Chart (Center at 100, 240) -->
    <!-- Grid -->
    <polygon points="100,160 169.2,200 169.2,280 100,320 30.8,280 30.8,200" class="radar-grid" />
    <polygon points="100,180 151.9,210 151.9,270 100,300 48.1,270 48.1,210" class="radar-grid" opacity="0.5" />
    <polygon points="100,200 134.6,220 134.6,260 100,280 65.4,260 65.4,220" class="radar-grid" opacity="0.5" />
    <line x1="100" y1="240" x2="100" y2="160" class="radar-grid" opacity="0.5" />
    <line x1="100" y1="240" x2="169.2" y2="200" class="radar-grid" opacity="0.5" />
    <line x1="100" y1="240" x2="169.2" y2="280" class="radar-grid" opacity="0.5" />
    <line x1="100" y1="240" x2="100" y2="320" class="radar-grid" opacity="0.5" />
    <line x1="100" y1="240" x2="30.8" y2="280" class="radar-grid" opacity="0.5" />
    <line x1="100" y1="240" x2="30.8" y2="200" class="radar-grid" opacity="0.5" />

    <!-- Labels -->
    <text x="100" y="150" class="label-glow" text-anchor="middle">FE (90)</text>
    <text x="180" y="205" class="label" text-anchor="start">UX (75)</text>
    <text x="180" y="285" class="label" text-anchor="start">DATA (70)</text>
    <text x="100" y="335" class="label" text-anchor="middle">SEC (80)</text>
    <text x="20" y="285" class="label" text-anchor="end">NET (85)</text>
    <text x="20" y="205" class="label" text-anchor="end">COM (80)</text>

    <!-- Data Polygon -->
    <!-- Center (100,240), R=80 for max (100) -->
    <!-- FE(90)=R72(100,168), UX(75)=R60(151.9,210), DATA(70)=R56(148.5,268), SEC(80)=R64(100,304), NET(85)=R68(41.1,274), COM(80)=R64(44.5,208) -->
    <polygon points="100,168 151.9,210 148.5,268 100,304 41.1,274 44.5,208" class="radar-fill" />
    <circle cx="100" cy="168" r="3" class="radar-point" />
    <circle cx="151.9" cy="210" r="3" class="radar-point" />
    <circle cx="148.5" cy="268" r="3" class="radar-point" />
    <circle cx="100" cy="304" r="3" class="radar-point" />
    <circle cx="41.1" cy="274" r="3" class="radar-point" />
    <circle cx="44.5" cy="208" r="3" class="radar-point" />
  </g>

  <!-- Right Panel: Detailed Progress Bars -->
  <g transform="translate(280, 70)">
    <!-- Header -->
    <text x="0" y="10" class="title-sub" fill="#00F0FF">TRACK BRIEF // HOLISTIC OVERVIEW</text>
    <text x="0" y="30" class="label">Complete 360° assessment across technical development, interface design, cyber defense, systems, and global soft skills.</text>
    <line x1="0" y1="50" x2="480" y2="50" stroke="#334155" stroke-width="1" />
    <text x="0" y="65" class="title-sub">PERSPECTIVE ATTRIBUTES · PERFORMANCE</text>

    <!-- Bars -->
    <!-- 1: Front-End -->
    <text x="0" y="95" class="label-glow">FE</text>
    <text x="40" y="95" class="label" fill="#F8FAFC">Front-End (React, Next.js)</text>
    <rect x="180" y="90" width="250" height="6" class="bar-bg" />
    <rect x="180" y="90" width="225" height="6" class="bar-fill" /> <!-- 90% -->
    <text x="450" y="96" class="score">90</text>

    <!-- 2: UX / UI -->
    <text x="0" y="135" class="label-glow">UX</text>
    <text x="40" y="135" class="label" fill="#F8FAFC">UI / UX Design (Tailwind)</text>
    <rect x="180" y="130" width="250" height="6" class="bar-bg" />
    <rect x="180" y="130" width="187" height="6" class="bar-fill" /> <!-- 75% -->
    <text x="450" y="136" class="score">75</text>

    <!-- 3: DATA -->
    <text x="0" y="175" class="label-glow">DATA</text>
    <text x="40" y="175" class="label" fill="#F8FAFC">Data &amp; APIs (Node, MySQL)</text>
    <rect x="180" y="170" width="250" height="6" class="bar-bg" />
    <rect x="180" y="170" width="175" height="6" class="bar-fill" /> <!-- 70% -->
    <text x="450" y="176" class="score">70</text>

    <!-- 4: Security -->
    <text x="0" y="215" class="label-glow">SEC</text>
    <text x="40" y="215" class="label" fill="#F8FAFC">Cybersecurity (OSINT)</text>
    <rect x="180" y="210" width="250" height="6" class="bar-bg" />
    <rect x="180" y="210" width="200" height="6" class="bar-fill-alt" /> <!-- 80% -->
    <text x="450" y="216" class="score">80</text>

    <!-- 5: Systems -->
    <text x="0" y="255" class="label-glow">NET</text>
    <text x="40" y="255" class="label" fill="#F8FAFC">Systems &amp; Net (Linux, Docker)</text>
    <rect x="180" y="250" width="250" height="6" class="bar-bg" />
    <rect x="180" y="250" width="212" height="6" class="bar-fill" /> <!-- 85% -->
    <text x="450" y="256" class="score">85</text>

    <!-- 6: Comm -->
    <text x="0" y="295" class="label-glow">COM</text>
    <text x="40" y="295" class="label" fill="#F8FAFC">Communication &amp; Leadership</text>
    <rect x="180" y="290" width="250" height="6" class="bar-bg" />
    <rect x="180" y="290" width="200" height="6" class="bar-fill" /> <!-- 80% -->
    <text x="450" y="296" class="score">80</text>
  </g>

</svg>
