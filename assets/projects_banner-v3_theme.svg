<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&amp;display=swap');
    
    .bg { fill: #020617; }
    
    .banner-text {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 32px;
      font-weight: 700;
      fill: #00D4FF;
      text-anchor: middle;
      filter: url(#neon-cyan);
      letter-spacing: 5px;
    }

    .line-l, .line-r {
      stroke: #334155;
      stroke-width: 2;
    }
    
    .accent {
      fill: #FF007A;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <rect width="800" height="100" class="bg" />
  
  <text x="400" y="60" class="banner-text">EXECUTABLE ARCHITECTURES</text>
  
  <line x1="20" y1="50" x2="120" y2="50" class="line-l" />
  <circle cx="120" cy="50" r="4" class="accent" />
  
  <line x1="680" y1="50" x2="780" y2="50" class="line-r" />
  <circle cx="680" cy="50" r="4" class="accent" />
</svg>
