<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap');
    
    .bg { fill: url(#bg-grad); }
    
    .title-main { font-family: 'Chakra Petch', sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
    .title-sub { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #94A3B8; }
    .label-glow { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #00F0FF; filter: url(#glow-cyan); font-weight: bold; }
    .tag { font-family: 'Share Tech Mono', monospace; font-size: 10px; fill: #020617; }
    
    /* HUD Styles from hud-v3 */
    .hud-base { fill: none; stroke: #334155; stroke-width: 2; opacity: 0.8; }
    .ring-1 { fill: none; stroke: #00F0FF; stroke-width: 3; stroke-dasharray: 40 20; transform-origin: 680px 150px; animation: spin 12s linear infinite; filter: url(#glow-cyan); }
    .ring-2 { fill: none; stroke: #00FFA3; stroke-width: 2; stroke-dasharray: 100 50 20 50; transform-origin: 680px 150px; animation: spin-reverse 8s linear infinite; filter: url(#glow-pink); }
    .ring-3 { fill: none; stroke: #334155; stroke-width: 6; stroke-dasharray: 2 15; transform-origin: 680px 150px; animation: spin 20s linear infinite; }
    .radar-sweep { fill: #00F0FF; opacity: 0.1; transform-origin: 680px 150px; animation: spin 4s linear infinite; }
    
    .hud-text { font-family: 'Share Tech Mono', monospace; font-size: 24px; fill: #F8FAFC; text-anchor: middle; filter: url(#glow-cyan); }
    .hud-sub { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #00FFA3; text-anchor: middle; letter-spacing: 2px; }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

    .box-border { stroke: #334155; stroke-width: 1; fill: none; }
    ]]>
  </style>

  <rect class="bg" width="800" height="300" />

  <!-- Left Side: Projects List -->
  <g transform="translate(30, 30)">
    
    <!-- Proj 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="30" fill="url(#cyber-grad)" fill-opacity="0.2" stroke="url(#cyber-grad)" stroke-width="1" />
      <text x="10" y="19" class="label-glow">[SYS.01] NU Wellness</text>
      <text x="150" y="14" class="title-main">Booking &amp; Consultant Management</text>
      <text x="150" y="28" class="title-sub">Scalable automated scheduling.</text>
      
      <!-- Tags -->
      <rect x="420" y="10" width="60" height="18" fill="#020617" stroke="#FF007A" stroke-width="1" rx="3" filter="url(#glow-pink)" />
      <text x="450" y="23" class="tag" text-anchor="middle" fill="#FF007A">Next.js</text>
      
      <rect x="485" y="10" width="50" height="18" fill="#020617" stroke="#00D4FF" stroke-width="1" rx="3" filter="url(#glow-cyan)" />
      <text x="510" y="23" class="tag" text-anchor="middle" fill="#00D4FF">Prisma</text>
    </g>
    
    <line x1="0" y1="45" x2="550" y2="45" stroke="#334155" />

    <!-- Proj 2 -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="130" height="30" fill="url(#cyber-grad)" fill-opacity="0.2" stroke="url(#cyber-grad)" stroke-width="1" />
      <text x="10" y="19" class="label-glow">[SYS.02] Smart Carpool</text>
      <text x="150" y="14" class="title-main">Ride Sharing Platform</text>
      <text x="150" y="28" class="title-sub">Eco-friendly route matching.</text>
      
      <!-- Tags -->
      <rect x="420" y="10" width="50" height="18" fill="#020617" stroke="#FF007A" stroke-width="1" rx="3" filter="url(#glow-pink)" />
      <text x="445" y="23" class="tag" text-anchor="middle" fill="#FF007A">React</text>
      
      <rect x="475" y="10" width="60" height="18" fill="#020617" stroke="#00D4FF" stroke-width="1" rx="3" filter="url(#glow-cyan)" />
      <text x="505" y="23" class="tag" text-anchor="middle" fill="#00D4FF">Node.js</text>
    </g>

    <line x1="0" y1="105" x2="550" y2="105" stroke="#334155" />

    <!-- Proj 3 -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="130" height="30" fill="url(#cyber-grad)" fill-opacity="0.2" stroke="url(#cyber-grad)" stroke-width="1" />
      <text x="10" y="19" class="label-glow">[SYS.03] Route Mapper</text>
      <text x="150" y="14" class="title-main">Safe Navigation Concept</text>
      <text x="150" y="28" class="title-sub">Interactive mapping tool.</text>
      
      <!-- Tags -->
      <rect x="420" y="10" width="70" height="18" fill="#020617" stroke="#FF007A" stroke-width="1" rx="3" filter="url(#glow-pink)" />
      <text x="455" y="23" class="tag" text-anchor="middle" fill="#FF007A">JavaScript</text>
      
      <rect x="495" y="10" width="50" height="18" fill="#020617" stroke="#00D4FF" stroke-width="1" rx="3" filter="url(#glow-cyan)" />
      <text x="520" y="23" class="tag" text-anchor="middle" fill="#00D4FF">Maps API</text>
    </g>

    <line x1="0" y1="165" x2="550" y2="165" stroke="#334155" />

    <!-- Proj 4 -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="130" height="30" fill="url(#cyber-grad)" fill-opacity="0.2" stroke="url(#cyber-grad)" stroke-width="1" />
      <text x="10" y="19" class="label-glow">[SEC.01] NetLabs</text>
      <text x="150" y="14" class="title-main">Cybersecurity Explorations</text>
      <text x="150" y="28" class="title-sub">Network packet analysis.</text>
      
      <!-- Tags -->
      <rect x="420" y="10" width="50" height="18" fill="#020617" stroke="#FF007A" stroke-width="1" rx="3" filter="url(#glow-pink)" />
      <text x="445" y="23" class="tag" text-anchor="middle" fill="#FF007A">Linux</text>
      
      <rect x="475" y="10" width="60" height="18" fill="#020617" stroke="#00D4FF" stroke-width="1" rx="3" filter="url(#glow-cyan)" />
      <text x="505" y="23" class="tag" text-anchor="middle" fill="#00D4FF">InfoSec</text>
    </g>
  </g>

  <!-- Right Side: Rotating HUD -->
  <!-- HUD placed at center cx=680, cy=150 -->
  <line x1="680" y1="30" x2="680" y2="270" class="hud-base" stroke-dasharray="2 6"/>
  <line x1="560" y1="150" x2="800" y2="150" class="hud-base" stroke-dasharray="2 6"/>

  <circle cx="680" cy="150" r="110" class="ring-1" />
  <circle cx="680" cy="150" r="85" class="ring-2" />
  <circle cx="680" cy="150" r="60" class="ring-3" />

  <path d="M680,150 L680,40 A110,110 0 0,1 790,150 Z" class="radar-sweep" />

  <circle cx="680" cy="150" r="35" fill="#020617" />
  <circle cx="680" cy="150" r="35" stroke="url(#cyber-grad)" stroke-width="2" fill="none" filter="url(#glow-cyan)"/>
  
  <text x="680" y="155" class="hud-text">SYS</text>
  <text x="680" y="170" class="hud-sub">ACTIVE</text>
  
  <path d="M 560 150 L 550 140 L 550 110 M 560 150 L 550 160 L 550 190" stroke="url(#cyber-grad)" stroke-width="2" fill="none"/>
  <path d="M 800 150 L 810 140 L 810 110 M 800 150 L 810 160 L 810 190" stroke="url(#cyber-grad)" stroke-width="2" fill="none"/>

</svg>
