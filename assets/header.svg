<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="100%" stop-color="#050510" />
    </linearGradient>
    
    <!-- Neon Purple Glow -->
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Cyan Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanning Line Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;family=Orbitron:wght@900&amp;display=swap');
    
    .bg { fill: url(#bg-grad); }
    .border { 
      fill: none; 
      stroke: #a855f7; 
      stroke-width: 2; 
      stroke-dasharray: 10 5;
      animation: dash 20s linear infinite;
    }
    
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 64px;
      fill: #fff;
      filter: url(#glow-purple);
      animation: pulse 3s ease-in-out infinite;
    }

    .subtitle {
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      fill: #00f2fe;
      letter-spacing: 2px;
    }

    .code {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      fill: #4ade80;
    }

    .scanline {
      fill: url(#scan-grad);
      animation: scan 4s linear infinite;
    }

    .magic-circle {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 1;
      opacity: 0.5;
      transform-origin: center;
      animation: spin 10s linear infinite;
    }

    .magic-circle-reverse {
      fill: none;
      stroke: #a855f7;
      stroke-width: 1.5;
      opacity: 0.5;
      transform-origin: center;
      animation: spin-reverse 15s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: 1000; }
    }
    
    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; opacity: 1; }
      50% { text-shadow: 0 0 5px #a855f7, 0 0 10px #a855f7; opacity: 0.8; }
    }

    @keyframes scan {
      0% { transform: translateY(-250px); }
      100% { transform: translateY(250px); }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    
    @keyframes spin-reverse {
      100% { transform: rotate(-360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="250" rx="15" />
  
  <!-- Animated Border -->
  <rect class="border" x="10" y="10" width="780" height="230" rx="10" filter="url(#glow-purple)" />

  <!-- Abstract Magic Circles / HUD -->
  <g transform="translate(120, 125)">
    <circle class="magic-circle" r="80" stroke-dasharray="10 5" />
    <circle class="magic-circle-reverse" r="60" stroke-dasharray="20 10" />
    <circle class="magic-circle" r="40" stroke-dasharray="5 5" />
    <polygon points="0,-90 10,-75 -10,-75" fill="#38bdf8" opacity="0.6"/>
    <polygon points="0,90 10,75 -10,75" fill="#38bdf8" opacity="0.6"/>
  </g>
  
  <g transform="translate(680, 125)">
    <circle class="magic-circle-reverse" r="70" stroke-dasharray="15 5" />
    <circle class="magic-circle" r="50" stroke-dasharray="8 8" />
    <circle class="magic-circle-reverse" r="30" stroke-dasharray="4 4" />
  </g>

  <!-- Main Text -->
  <text x="400" y="110" class="title" text-anchor="middle">NATHAN_JNZ</text>
  <text x="400" y="145" class="subtitle" text-anchor="middle" filter="url(#glow-cyan)">&lt; FULL-STACK SEC_OPS /&gt;</text>
  
  <!-- Cyber HUD Details -->
  <text x="30" y="40" class="code">SYS.STATUS: ONLINE | SECURE</text>
  <text x="30" y="220" class="code" fill="#a855f7">LOC: BANGKOK (UTC+7)</text>
  
  <text x="590" y="40" class="code">NET.PING: 12ms</text>
  <text x="590" y="220" class="code">VULN_SCAN: 0 THREATS</text>

  <!-- Terminal Cursor -->
  <rect x="525" y="130" width="10" height="18" fill="#00f2fe">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- Scanning Line -->
  <rect class="scanline" width="800" height="20" opacity="0.3" />
</svg>
