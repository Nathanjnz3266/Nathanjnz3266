<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&amp;family=Share+Tech+Mono&amp;display=swap');
    
    .label-glow { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #FF007A; font-weight: bold; }
    .label-cyan { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #00D4FF; font-weight: bold; }
    
    .title-main { font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 700; fill: #F8FAFC; letter-spacing: 1px; }
    .title-sub { font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 500; fill: #00D4FF; }
    .desc { font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 500; fill: #94A3B8; }
    
    .tag { font-family: 'Share Tech Mono', monospace; font-size: 10px; font-weight: bold; text-anchor: middle; }
    
    .card-bg { fill: #020617; stroke: #334155; stroke-width: 1; rx: 6; }
    .card-header { fill: url(#cyber-grad); opacity: 0.15; }
    
    .hover-fx { transition: all 0.3s ease; }
    .hover-fx:hover { transform: translateY(-2px); stroke: #FF007A; filter: url(#glow-pink); }
  </style>

  <!-- Project 1: NU Wellness -->
  <g transform="translate(10, 10)">
    <rect width="380" height="115" class="card-bg hover-fx" />
    <rect width="380" height="30" class="card-header" rx="6" />
    
    <text x="15" y="21" class="label-glow">[ SYS.01 ]</text>
    <text x="100" y="21" class="title-main">NU Wellness</text>
    
    <text x="15" y="55" class="title-sub">Booking &amp; Consultant Management</text>
    <text x="15" y="75" class="desc">Scalable automated scheduling.</text>
    
    <!-- Tags -->
    <rect x="15" y="88" width="60" height="16" fill="none" stroke="#FF007A" rx="3" />
    <text x="45" y="100" class="tag" fill="#FF007A">Next.js</text>
    
    <rect x="85" y="88" width="60" height="16" fill="none" stroke="#00D4FF" rx="3" />
    <text x="115" y="100" class="tag" fill="#00D4FF">Prisma</text>
  </g>

  <!-- Project 2: Smart Carpool -->
  <g transform="translate(410, 10)">
    <rect width="380" height="115" class="card-bg hover-fx" />
    <rect width="380" height="30" class="card-header" rx="6" />
    
    <text x="15" y="21" class="label-cyan">[ SYS.02 ]</text>
    <text x="100" y="21" class="title-main">Smart Carpool</text>
    
    <text x="15" y="55" class="title-sub">Ride Sharing Platform</text>
    <text x="15" y="75" class="desc">Eco-friendly route matching.</text>
    
    <!-- Tags -->
    <rect x="15" y="88" width="50" height="16" fill="none" stroke="#FF007A" rx="3" />
    <text x="40" y="100" class="tag" fill="#FF007A">React</text>
    
    <rect x="75" y="88" width="65" height="16" fill="none" stroke="#00D4FF" rx="3" />
    <text x="107" y="100" class="tag" fill="#00D4FF">Node.js</text>
  </g>

  <!-- Project 3: Route Mapper -->
  <g transform="translate(10, 140)">
    <rect width="380" height="115" class="card-bg hover-fx" />
    <rect width="380" height="30" class="card-header" rx="6" />
    
    <text x="15" y="21" class="label-cyan">[ SYS.03 ]</text>
    <text x="100" y="21" class="title-main">Route Mapper</text>
    
    <text x="15" y="55" class="title-sub">Safe Navigation Concept</text>
    <text x="15" y="75" class="desc">Interactive mapping tool.</text>
    
    <!-- Tags -->
    <rect x="15" y="88" width="75" height="16" fill="none" stroke="#FF007A" rx="3" />
    <text x="52" y="100" class="tag" fill="#FF007A">JavaScript</text>
    
    <rect x="100" y="88" width="65" height="16" fill="none" stroke="#00D4FF" rx="3" />
    <text x="132" y="100" class="tag" fill="#00D4FF">Maps API</text>
  </g>

  <!-- Project 4: NetLabs -->
  <g transform="translate(410, 140)">
    <rect width="380" height="115" class="card-bg hover-fx" />
    <rect width="380" height="30" class="card-header" rx="6" />
    
    <text x="15" y="21" class="label-glow">[ SEC.01 ]</text>
    <text x="100" y="21" class="title-main">NetLabs</text>
    
    <text x="15" y="55" class="title-sub">Cybersecurity Explorations</text>
    <text x="15" y="75" class="desc">Network packet analysis.</text>
    
    <!-- Tags -->
    <rect x="15" y="88" width="50" height="16" fill="none" stroke="#FF007A" rx="3" />
    <text x="40" y="100" class="tag" fill="#FF007A">Linux</text>
    
    <rect x="75" y="88" width="65" height="16" fill="none" stroke="#00D4FF" rx="3" />
    <text x="107" y="100" class="tag" fill="#00D4FF">InfoSec</text>
  </g>

</svg>
