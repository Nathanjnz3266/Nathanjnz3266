<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
    
    .bg-rect { fill: url(#bg); }
    
    .cyber-line {
      stroke: #38bdf8;
      stroke-width: 2;
      fill: none;
      filter: url(#glow);
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 4s ease-out forwards;
    }

    .cyber-text {
      font-family: 'Fira Code', monospace;
      font-size: 24px;
      fill: #4ade80;
      filter: url(#glow);
      text-anchor: middle;
      opacity: 0;
      animation: type 0.5s 2s forwards, pulse 2s 2.5s infinite;
    }
    
    .sub-text {
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      fill: #a855f7;
      text-anchor: middle;
      opacity: 0;
      animation: type 0.5s 2.5s forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes type {
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .warning-bar {
      fill: #ff0055;
      animation: slide 5s linear infinite;
    }
    
    @keyframes slide {
      0% { transform: translateX(-800px); }
      100% { transform: translateX(800px); }
    }
  </style>

  <rect width="800" height="150" class="bg-rect" />
  
  <!-- Cyber Borders -->
  <path d="M 20 20 L 100 20 L 120 40 L 680 40 L 700 20 L 780 20 L 780 130 L 700 130 L 680 110 L 120 110 L 100 130 L 20 130 Z" class="cyber-line" />
  
  <!-- Moving Warning Bar -->
  <clipPath id="clip-bar">
    <rect x="125" y="115" width="550" height="5" />
  </clipPath>
  <g clip-path="url(#clip-bar)">
    <rect x="0" y="115" width="200" height="5" class="warning-bar" />
    <rect x="400" y="115" width="200" height="5" class="warning-bar" />
  </g>

  <!-- Text -->
  <text x="400" y="75" class="cyber-text">>_ SYSTEM_DISCONNECTED</text>
  <text x="400" y="95" class="sub-text">© Nathan_Jnz - End of Transmission</text>
</svg>
