<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%">
  <defs>
    <filter id="neon-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;display=swap');
    
    .bg { fill: #030712; }
    
    .banner-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      fill: #a855f7;
      text-anchor: middle;
      filter: url(#neon-purple);
      letter-spacing: 5px;
    }

    .line-l, .line-r {
      stroke: #a855f7;
      stroke-width: 2;
      filter: url(#neon-purple);
    }
    
    .accent {
      fill: #00f2fe;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <rect width="800" height="100" class="bg" />
  
  <text x="400" y="60" class="banner-text">EXECUTABLE ARCHITECTURES</text>
  
  <!-- Left Lines -->
  <line x1="20" y1="50" x2="120" y2="50" class="line-l" />
  <circle cx="120" cy="50" r="4" class="accent" />
  
  <!-- Right Lines -->
  <line x1="680" y1="50" x2="780" y2="50" class="line-r" />
  <circle cx="680" cy="50" r="4" class="accent" />
</svg>
