<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-mint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap');
    
    .bg { fill: url(#bg-grad); }
    .panel { fill: #020617; stroke: #334155; stroke-width: 1; opacity: 0.8; }
    .panel-active { fill: #0F172A; stroke: #00F0FF; stroke-width: 1; opacity: 0.9; }
    
    .title-main { font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 700; fill: #F8FAFC; letter-spacing: 1px; }
    .title-sub { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #94A3B8; letter-spacing: 1px; }
    .label-glow { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #00F0FF; filter: url(#glow-cyan); font-weight: bold; }
    .score { font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 700; fill: #00FFA3; filter: url(#glow-mint); }
    
    .pulse { animation: pulse-anim 2s infinite; }
    @keyframes pulse-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    ]]>
  </style>

  <rect class="bg" width="800" height="180" />

  <!-- Education Panel -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="230" height="140" class="panel" />
    <path d="M 0 0 L 20 0 L 20 20 Z" fill="#00F0FF" />
    <text x="115" y="30" class="label-glow" text-anchor="middle">[ SYS.EDU ]</text>
    <text x="115" y="65" class="title-main" text-anchor="middle">NARESUAN UNIV.</text>
    <text x="115" y="90" class="title-sub" text-anchor="middle">B.Sc Computer Science</text>
    <text x="115" y="115" class="score" text-anchor="middle">GPA: 2.69</text>
  </g>

  <!-- Internship Panel -->
  <g transform="translate(285, 20)">
    <rect x="0" y="0" width="230" height="140" class="panel-active" />
    <rect x="0" y="0" width="230" height="2" fill="#00FFA3" filter="url(#glow-mint)" />
    <text x="115" y="30" class="label-glow" text-anchor="middle" fill="#00FFA3">[ DEPLOYMENT ]</text>
    <text x="115" y="65" class="title-main" text-anchor="middle">INTERNSHIP AVAIL.</text>
    <text x="115" y="90" class="title-sub" text-anchor="middle" fill="#F8FAFC">16 NOV 2026</text>
    <text x="115" y="105" class="title-sub" text-anchor="middle">|</text>
    <text x="115" y="120" class="title-sub" text-anchor="middle" fill="#F8FAFC">26 FEB 2027</text>
  </g>

  <!-- Contact Panel -->
  <g transform="translate(540, 20)">
    <rect x="0" y="0" width="230" height="140" class="panel" />
    <path d="M 230 140 L 210 140 L 210 120 Z" fill="#00F0FF" />
    <text x="115" y="30" class="label-glow" text-anchor="middle">[ SYS.COM ]</text>
    
    <text x="15" y="65" class="title-sub" fill="#00F0FF">MAIL:</text>
    <text x="55" y="65" class="title-sub" fill="#F8FAFC">lastonce3266@gmail.com</text>
    
    <text x="15" y="95" class="title-sub" fill="#00FFA3">COMM:</text>
    <text x="55" y="95" class="title-sub" fill="#F8FAFC">(+66) 96 545 8935</text>
    
    <text x="15" y="125" class="title-sub" fill="#94A3B8">NET:</text>
    <text x="55" y="125" class="title-sub" fill="#F8FAFC">github.com/Nathanjnz3266</text>
  </g>

  <!-- Connective lines -->
  <line x1="260" y1="90" x2="285" y2="90" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4 2" class="pulse" />
  <line x1="515" y1="90" x2="540" y2="90" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4 2" class="pulse" />

</svg>
