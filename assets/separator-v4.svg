<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#A200FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="40" fill="#020617" />
  
  <!-- Glowing Gradient Line -->
  <line x1="50" y1="20" x2="750" y2="20" stroke="url(#cyber-grad)" stroke-width="2" filter="url(#glow)" />
  <line x1="50" y1="20" x2="750" y2="20" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
  
  <!-- Diamond center node -->
  <polygon points="400,12 408,20 400,28 392,20" fill="#00D4FF" filter="url(#glow)" />
  <polygon points="400,16 404,20 400,24 396,20" fill="#FFFFFF" />

  <!-- Side nodes -->
  <circle cx="50" cy="20" r="3" fill="#00D4FF" filter="url(#glow)"/>
  <circle cx="750" cy="20" r="3" fill="#FF007A" filter="url(#glow)"/>
</svg>
